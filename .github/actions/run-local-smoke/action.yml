name: Run Local Smoke
description: Build the app, start a local preview server, and run Playwright smoke tests with a standard CI environment.

inputs:
  app-version:
    description: App version value exposed to the local smoke environment.
    required: false
    default: ""
  port:
    description: Preview server port used for the smoke run.
    required: false
    default: "4173"
  host:
    description: Preview server host used for the smoke run.
    required: false
    default: "127.0.0.1"
  preview-log-path:
    description: File path used to capture preview server logs (defaults to $RUNNER_TEMP/bougnat-preview.log).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Export local smoke env
      shell: bash
      run: |
        {
          echo "PLAYWRIGHT_BASE_URL=http://${{ inputs.host }}:${{ inputs.port }}"
          echo "VITE_APP_ENV=ci"
          echo "VITE_APP_NAME=Bougnat Darts"
          echo "VITE_APP_VERSION=${{ inputs.app-version }}"
          echo "VITE_APP_URL=http://${{ inputs.host }}:${{ inputs.port }}"
          echo "VITE_CF_WEB_ANALYTICS_TOKEN=ci-placeholder-token"
          echo "VITE_ENABLE_VOICE_SCORING=true"
          echo "VITE_APP_ACCESS_MODE=local"
          echo "VITE_LOG_LEVEL=warn"
          echo "VITE_EXTERNAL_RETURN_ALLOWED_ORIGINS=https://partner.example"
          # Spec 043 FR-05: the preview server below is the only one; run-playwright.sh must not start another.
          echo "PLAYWRIGHT_EXTERNAL_SERVER=1"
        } >> "$GITHUB_ENV"

    - name: Build app for smoke validation
      shell: bash
      run: npm run build

    - name: Verify generated app QR asset
      shell: bash
      run: test -s public/app-qr.svg

    - name: Start preview server
      shell: bash
      env:
        PREVIEW_HOST: ${{ inputs.host }}
        PREVIEW_PORT: ${{ inputs.port }}
        PREVIEW_LOG_PATH: ${{ inputs.preview-log-path }}
      run: |
        set -euo pipefail
        log_path="${PREVIEW_LOG_PATH:-$RUNNER_TEMP/bougnat-preview.log}"
        url="http://${PREVIEW_HOST}:${PREVIEW_PORT}/"
        mkdir -p "$(dirname "$log_path")"
        echo "Journal du serveur vite preview : $log_path"

        if (exec 3<>"/dev/tcp/${PREVIEW_HOST}/${PREVIEW_PORT}") 2>/dev/null; then
          echo "::error title=Port occupé::Le port ${PREVIEW_PORT} est déjà utilisé sur ${PREVIEW_HOST} : le smoke exige un serveur unique sur un port strict."
          exit 1
        fi

        npm run preview -- --host "$PREVIEW_HOST" --port "$PREVIEW_PORT" --strictPort > "$log_path" 2>&1 &
        preview_pid=$!

        for _ in $(seq 1 120); do
          if ! kill -0 "$preview_pid" 2>/dev/null; then
            echo "::error title=Serveur vite preview arrêté::Le serveur vite preview s'est arrêté au démarrage (port ${PREVIEW_PORT} strict)."
            cat "$log_path"
            exit 1
          fi
          if curl --silent --fail --output /dev/null "$url"; then
            echo "Serveur vite preview unique démarré sur $url (PID $preview_pid)."
            exit 0
          fi
          sleep 1
        done

        echo "::error title=Serveur vite preview indisponible::$url ne répond pas après 120 s."
        cat "$log_path"
        exit 1

    - name: Run Playwright smoke tests
      shell: bash
      run: npm run test:e2e
