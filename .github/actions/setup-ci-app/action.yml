name: Setup CI App
description: Setup Node.js, install app dependencies with fallback logic, and optionally install Playwright for local builds.

inputs:
  required-packages:
    description: Space-separated package names expected in node_modules after install.
    required: false
    default: ""
  install-playwright:
    description: Whether to install the Playwright Chromium and WebKit browsers and OS dependencies.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: npm

    - name: Install dependencies
      shell: bash
      env:
        NODE_ENV: development
        REQUIRED_PACKAGES: ${{ inputs.required-packages }}
      run: |
        install_ok=1
        npm ci --include=dev --no-audit --no-fund || install_ok=0

        node <<'EOF' || install_ok=0
        const fs = require('fs');
        const checks = (process.env.REQUIRED_PACKAGES || '').split(/\s+/).filter(Boolean);
        const missing = checks.filter((name) => !fs.existsSync(`node_modules/${name}/package.json`));
        if (missing.length > 0) {
          console.log(`Missing after npm ci: ${missing.join(', ')}`);
          process.exit(1);
        }
        EOF

        if [ "$install_ok" -ne 1 ]; then
          rm -rf node_modules
          corepack enable
          corepack prepare pnpm@10.18.3 --activate
          pnpm install --no-frozen-lockfile --config.node-linker=hoisted
        fi

        node <<'EOF'
        const fs = require('fs');
        const checks = (process.env.REQUIRED_PACKAGES || '').split(/\s+/).filter(Boolean);
        const missing = checks.filter((name) => !fs.existsSync(`node_modules/${name}/package.json`));
        if (missing.length > 0) {
          throw new Error(`Missing after fallback install: ${missing.join(', ')}`);
        }
        EOF

    - name: Install Playwright browsers
      if: ${{ inputs.install-playwright == 'true' }}
      shell: bash
      run: npx playwright install --with-deps chromium webkit
