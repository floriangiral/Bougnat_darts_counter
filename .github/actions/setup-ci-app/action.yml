name: Setup CI App
description: Setup Node.js and the declared npm version, install locked dependencies, and optionally install Playwright.

inputs:
  required-packages:
    description: Space-separated package names expected in node_modules after install.
    required: false
    default: ""
  install-playwright:
    description: Whether to install the Playwright Chromium and WebKit browsers and OS dependencies.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Setup declared npm version
      shell: bash
      run: |
        set -euo pipefail
        package_manager="$(node -p "require('./package.json').packageManager")"
        if [[ ! "$package_manager" =~ ^npm@[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "package.json must declare an exact npm version in packageManager." >&2
          exit 1
        fi
        npm install --global "$package_manager" --no-audit --no-fund
        npm --version

    - name: Install locked dependencies
      shell: bash
      env:
        NODE_ENV: development
        REQUIRED_PACKAGES: ${{ inputs.required-packages }}
      run: |
        set -euo pipefail
        npm ci --include=dev --no-audit --no-fund

        node <<'EOF'
        const fs = require('fs');
        const checks = (process.env.REQUIRED_PACKAGES || '').split(/\s+/).filter(Boolean);
        const missing = checks.filter((name) => !fs.existsSync(`node_modules/${name}/package.json`));
        if (missing.length > 0) {
          throw new Error(`Missing after npm ci: ${missing.join(', ')}`);
        }
        EOF

    - name: Install Playwright browsers
      if: ${{ inputs.install-playwright == 'true' }}
      shell: bash
      run: npx playwright install --with-deps chromium webkit
