name: Promote Preprod

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: promote-preprod
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  promote:
    name: Deploy main to preprod
    runs-on: ubuntu-latest
    environment: preprod
    env:
      VITE_APP_ENV: ${{ vars.VITE_APP_ENV }}
      VITE_APP_NAME: ${{ vars.VITE_APP_NAME }}
      VITE_APP_VERSION: ${{ github.sha }}
      VITE_APP_URL: ${{ vars.VITE_APP_URL }}
      VITE_ENABLE_ANALYTICS: ${{ vars.VITE_ENABLE_ANALYTICS }}
      VITE_ENABLE_BETA_BADGE: ${{ vars.VITE_ENABLE_BETA_BADGE }}
      VITE_ENABLE_VOICE_SCORING: ${{ vars.VITE_ENABLE_VOICE_SCORING }}
      VITE_LOG_LEVEL: ${{ vars.VITE_LOG_LEVEL }}
      DEEPGRAM_PROJECT_ID: ${{ vars.DEEPGRAM_PROJECT_ID }}
      DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Ensure workflow targets main
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "This workflow must be launched from the main branch." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup CI app
        uses: ./.github/actions/setup-ci-app
        with:
          required-packages: "vite"

      - name: Prepare pnpm for Vercel CLI
        run: |
          corepack enable
          corepack prepare pnpm@10.18.3 --activate

      - name: Validate preprod environment
        run: npm run preprod:check

      - name: Validate Deepgram credentials
        run: |
          response_code="$(curl -sS -o /tmp/deepgram-grant.json -w "%{http_code}" \
            -X POST https://api.deepgram.com/v1/auth/grant \
            -H "Authorization: Token ${DEEPGRAM_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"ttl_seconds":55}')"

          if [ "$response_code" != "200" ]; then
            echo "Deepgram credential validation failed before deployment." >&2
            cat /tmp/deepgram-grant.json >&2
            exit 1
          fi

      - name: Validate Vercel access
        run: pnpm dlx vercel@latest whoami --token=${{ secrets.VERCEL_TOKEN }}

      - name: Pull Vercel project settings
        run: pnpm dlx vercel@latest pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Vercel artifacts
        run: pnpm dlx vercel@latest build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy preprod artifacts
        id: deploy
        run: |
          url="$(pnpm dlx vercel@latest deploy --prebuilt --prod \
            --env=DEEPGRAM_PROJECT_ID=${DEEPGRAM_PROJECT_ID} \
            --env=DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY} \
            --token=${{ secrets.VERCEL_TOKEN }})"
          echo "deployment_url=$url" >> "$GITHUB_OUTPUT"

      - name: Deployment summary
        run: |
          {
            echo "## Preprod deployment"
            echo ""
            echo "- Source branch: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- URL: ${{ steps.deploy.outputs.deployment_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
