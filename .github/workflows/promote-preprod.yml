name: Deploy Preview

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      confirm_branch:
        description: Type the source branch name to confirm the preview deployment.
        required: true
        type: string
      confirm_target:
        description: Type the target environment name to confirm the preview deployment.
        required: true
        type: string
      reason:
        description: Short reason for the preview deployment.
        required: false
        type: string

concurrency:
  group: release-delivery
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    name: Deploy Preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: preprod
    env:
      VITE_APP_ENV: ${{ vars.VITE_APP_ENV }}
      VITE_APP_NAME: ${{ vars.VITE_APP_NAME }}
      VITE_APP_VERSION: ${{ github.sha }}
      VITE_APP_URL: ${{ vars.VITE_APP_URL }}
      VITE_APP_ACCESS_MODE: ${{ vars.VITE_APP_ACCESS_MODE }}
      VITE_CF_WEB_ANALYTICS_TOKEN: ${{ vars.VITE_CF_WEB_ANALYTICS_TOKEN }}
      VITE_ENABLE_VOICE_SCORING: ${{ vars.VITE_ENABLE_VOICE_SCORING }}
      VITE_LOG_LEVEL: ${{ vars.VITE_LOG_LEVEL }}
      DEEPGRAM_PROJECT_ID: ${{ vars.DEEPGRAM_PROJECT_ID }}
      DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}

    steps:
      - name: Ensure manual run targets preprod
        run: |
          if [ "${GITHUB_REF_NAME}" != "preprod" ]; then
            echo "This workflow must be launched from the preprod branch." >&2
            exit 1
          fi
          if [ "${{ inputs.confirm_branch }}" != "preprod" ]; then
            echo "confirm_branch must equal preprod." >&2
            exit 1
          fi
          if [ "${{ inputs.confirm_target }}" != "preprod" ]; then
            echo "confirm_target must equal preprod." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup CI app
        uses: ./.github/actions/setup-ci-app
        with:
          required-packages: "vite wrangler"

      - name: Validate preprod environment
        run: npm run preprod:check

      - name: Validate Deepgram credentials
        run: |
          [ -n "${DEEPGRAM_API_KEY:-}" ] || { echo "Missing DEEPGRAM_API_KEY." >&2; exit 1; }
          [ -n "${DEEPGRAM_PROJECT_ID:-}" ] || { echo "Missing DEEPGRAM_PROJECT_ID." >&2; exit 1; }

          response_code="$(curl -sS -o /tmp/deepgram-project.json -w "%{http_code}" \
            --connect-timeout 5 --max-time 20 \
            --retry 2 --retry-delay 2 \
            -H "Authorization: Token ${DEEPGRAM_API_KEY}" \
            "https://api.deepgram.com/v1/projects/${DEEPGRAM_PROJECT_ID}")"

          if [ "$response_code" != "200" ]; then
            echo "Deepgram project validation failed before deployment." >&2
            cat /tmp/deepgram-project.json >&2
            exit 1
          fi

      - name: Build preprod bundle
        run: npm run build

      - name: Verify generated app QR asset
        run: test -s public/app-qr.svg

      - name: Deployment summary
        run: |
          {
            echo "## Preprod deployment"
            echo ""
            echo "- Source branch: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Reason: ${{ inputs.reason || 'n/a' }}"
            echo "- Build: \`npm run build\` validated"
            echo "- Delivery: handled by the connected hosting project for the tracked branch"
          } >> "$GITHUB_STEP_SUMMARY"
