name: Promote Preprod

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:

concurrency:
  group: promote-preprod
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  promote:
    name: Deploy main to preprod
    runs-on: ubuntu-latest
    environment: preprod
    env:
      VITE_APP_ENV: ${{ vars.VITE_APP_ENV }}
      VITE_APP_NAME: ${{ vars.VITE_APP_NAME }}
      VITE_APP_VERSION: ${{ github.sha }}
      VITE_APP_URL: ${{ vars.VITE_APP_URL }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_ENABLE_ANALYTICS: ${{ vars.VITE_ENABLE_ANALYTICS }}
      VITE_ENABLE_BETA_BADGE: ${{ vars.VITE_ENABLE_BETA_BADGE }}
      VITE_ENABLE_VOICE_SCORING: ${{ vars.VITE_ENABLE_VOICE_SCORING }}
      VITE_LOG_LEVEL: ${{ vars.VITE_LOG_LEVEL }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      DEEPGRAM_PROJECT_ID: ${{ vars.DEEPGRAM_PROJECT_ID }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Ensure manual run targets main
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "This workflow must be launched from the main branch." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Prepare pnpm for Vercel CLI
        run: |
          corepack enable
          corepack prepare pnpm@10.18.3 --activate

      - name: Validate preprod environment
        run: npm run preprod:check

      - name: Pull Vercel project settings
        run: pnpm dlx vercel@latest pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Vercel artifacts
        run: |
          pnpm dlx vercel@latest build --prod \
            --build-env VITE_APP_ENV="$VITE_APP_ENV" \
            --build-env VITE_APP_NAME="$VITE_APP_NAME" \
            --build-env VITE_APP_VERSION="$VITE_APP_VERSION" \
            --build-env VITE_APP_URL="$VITE_APP_URL" \
            --build-env VITE_SUPABASE_URL="$VITE_SUPABASE_URL" \
            --build-env VITE_SUPABASE_ANON_KEY="$VITE_SUPABASE_ANON_KEY" \
            --build-env VITE_ENABLE_ANALYTICS="$VITE_ENABLE_ANALYTICS" \
            --build-env VITE_ENABLE_BETA_BADGE="$VITE_ENABLE_BETA_BADGE" \
            --build-env VITE_ENABLE_VOICE_SCORING="$VITE_ENABLE_VOICE_SCORING" \
            --build-env VITE_LOG_LEVEL="$VITE_LOG_LEVEL" \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy preprod artifacts
        id: deploy
        run: |
          url="$(pnpm dlx vercel@latest deploy --prebuilt --prod \
            --env DEEPGRAM_API_KEY=\"$DEEPGRAM_API_KEY\" \
            --env DEEPGRAM_PROJECT_ID=\"$DEEPGRAM_PROJECT_ID\" \
            --token=${{ secrets.VERCEL_TOKEN }})"
          echo "deployment_url=$url" >> "$GITHUB_OUTPUT"

      - name: Deployment summary
        run: |
          {
            echo "## Preprod deployment"
            echo ""
            echo "- Source branch: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- URL: ${{ steps.deploy.outputs.deployment_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
