name: Secret Scan

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    branches:
      - main
      - preprod
      - develop
      - "release/**"
  push:
    branches:
      - main
      - preprod
  schedule:
    - cron: "11 6 * * 1"
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Secret scan summary
        if: success()
        run: |
          {
            echo "## Secret Scan"
            echo ""
            echo "- Ref: \`${GITHUB_REF_NAME}\`"
            echo "- Result: no secrets detected"
          } >> "$GITHUB_STEP_SUMMARY"
