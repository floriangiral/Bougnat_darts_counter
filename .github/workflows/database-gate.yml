name: Database Gate

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

concurrency:
  group: database-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rls-tests:
    name: Supabase RLS Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Setup CI app
        uses: ./.github/actions/setup-ci-app
        with:
          required-packages: "vitest supabase"

      - name: Start Supabase
        run: npm run supabase:start

      - name: Reset and seed local database
        run: npm run supabase:reset:seeded

      - name: Run RLS test suite
        run: npm run test:db

      - name: Stop Supabase
        if: always()
        run: npm run supabase:stop
