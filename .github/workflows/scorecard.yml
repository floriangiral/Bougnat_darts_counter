name: OpenSSF Scorecard

# Spec 119 (V2-SEC-04) : analyse Scorecard hebdomadaire, publiée (api.scorecard.dev) et envoyée
# dans l'onglet Security. Non bloquante pour les PR. Le job d'analyse respecte les restrictions
# de publication de Scorecard : pas d'env global, pas d'étape `run`, actions autorisées seulement.
# Aucun jeton personnel (Q1) : la vérification Branch-Protection reste partielle, limite documentée.

on:
  branch_protection_rule:
  schedule:
    - cron: "41 4 * * 1"
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    if: github.event.repository.default_branch == github.ref_name
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        id: scorecard
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF artifact
        if: always() && (steps.scorecard.outcome == 'success' || hashFiles('scorecard.sarif') != '')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: scorecard.sarif
          retention-days: 14
          if-no-files-found: error

      - name: Upload to code scanning
        if: always() && hashFiles('scorecard.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: scorecard.sarif
          category: scorecard
