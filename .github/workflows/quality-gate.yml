name: Quality Gate

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    branches:
      - main
      - preprod
      - develop
      - "release/**"
  push:
    branches:
      - main
  schedule:
    - cron: "47 6 * * 1"
  workflow_dispatch:

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Typecheck, Unit Tests, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup CI app
        uses: ./.github/actions/setup-ci-app
        with:
          required-packages: "eslint vite vitest"

      - name: Validate public env schema
        run: npm run env:check

      # Spec 043 FR-01: same list as CONTRIBUTING.md « Vérification minimale ».
      - name: Guard clean codebase
        run: npm run guard:clean

      - name: Validate Wrangler config
        run: npm run wrangler:check

      - name: Validate coverage governance
        run: npm run governance:coverage

      # Reserved slots: `governance:specs` (V2-SDD-01, spec 032) and the layer guard (V2-ARCH-01, spec 056)
      # are added here once those specs are implemented.

      - name: Lint
        run: npm run lint

      - name: Type-aware lint
        run: npm run lint:type-aware

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:unit:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage
          retention-days: ${{ github.event_name == 'schedule' && 14 || 7 }}
          if-no-files-found: error

      - name: Build
        run: npm run build
        env:
          VITE_APP_ENV: ci
          VITE_APP_NAME: Bougnat Darts
          VITE_APP_VERSION: ${{ github.sha }}
          VITE_APP_URL: http://localhost:3000
          VITE_CF_WEB_ANALYTICS_TOKEN: ci-placeholder-token
          VITE_ENABLE_VOICE_SCORING: false
          VITE_APP_ACCESS_MODE: local
          VITE_LOG_LEVEL: warn

      - name: Verify generated app QR asset
        run: test -s public/app-qr.svg

      - name: Upload production build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-build
          path: dist
          retention-days: ${{ github.event_name == 'schedule' && 14 || 7 }}
          if-no-files-found: error

      - name: Quality summary
        run: |
          {
            echo "## Quality Gate"
            echo ""
            echo "- Ref: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Result: env schema, clean-codebase guard, Wrangler config, coverage governance, lint, type-aware lint, typecheck, unit tests and build passed"
          } >> "$GITHUB_STEP_SUMMARY"

  global-quality-baseline:
    name: Global Quality Baseline
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-report
          path: coverage

      # Spec 043 FR-04: floors are read from vitest.config.ts, never hard-coded here.
      - name: Publish global quality baseline
        run: node scripts/ci-coverage-summary.mjs coverage/coverage-summary.json

  sonar:
    name: SonarCloud
    needs: [validate, global-quality-baseline]
    # Runs even when the baseline job is skipped (PRs not targeting main, pushes, schedule).
    if: ${{ !cancelled() && needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      # Spec 043 FR-09: fork and Dependabot PRs have no SONAR_TOKEN; skip cleanly instead of failing.
      - name: Check SonarCloud token availability
        id: sonar-token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=SonarCloud::Analyse ignorée : secret SONAR_TOKEN indisponible (PR de fork ou Dependabot)."
            {
              echo "## SonarCloud"
              echo ""
              echo "- Analyse ignorée : secret \`SONAR_TOKEN\` indisponible (PR de fork ou Dependabot)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout
        if: steps.sonar-token.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download coverage report
        if: steps.sonar-token.outputs.available == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-report
          path: coverage

      - name: Run SonarCloud analysis
        if: steps.sonar-token.outputs.available == 'true'
        uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16 # v8.5.1
        with:
          # Les anciens caches JS/TS ne contiennent pas les graphes d'architecture UDG.
          args: -Dsonar.analysisCache.enabled=false
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
