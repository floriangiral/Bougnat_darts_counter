name: Quality Gate

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    branches:
      - main
      - preprod
      - develop
      - "release/**"

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Typecheck, Unit Tests, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup CI app
        uses: ./.github/actions/setup-ci-app
        with:
          required-packages: "eslint vite vitest"

      - name: Validate public env schema
        run: npm run env:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build
        env:
          VITE_APP_ENV: ci
          VITE_APP_NAME: Bougnat Darts
          VITE_APP_VERSION: ${{ github.sha }}
          VITE_APP_URL: http://localhost:3000
          VITE_CF_WEB_ANALYTICS_TOKEN: ci-placeholder-token
          VITE_ENABLE_VOICE_SCORING: false
          VITE_APP_ACCESS_MODE: local
          VITE_LOG_LEVEL: warn

      - name: Verify generated app QR asset
        run: test -s public/app-qr.svg

      - name: Quality summary
        run: |
          {
            echo "## Quality Gate"
            echo ""
            echo "- Ref: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Result: lint, typecheck, unit tests and build passed"
          } >> "$GITHUB_STEP_SUMMARY"
