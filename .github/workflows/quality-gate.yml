name: Quality Gate

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    branches:
      - main
      - develop
      - "release/**"

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Typecheck, Unit Tests, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Print runtime versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        env:
          NODE_ENV: development
          NPM_CONFIG_PRODUCTION: "false"
        run: npm ci --include=dev --no-audit --no-fund

      - name: Verify toolchain packages
        run: |
          node <<'EOF'
          const fs = require('fs');
          const checks = [['eslint', '9.39.4'], ['vite', '6.4.1'], ['vitest', '4.1.2']];
          for (const [name, version] of checks) {
            const pkg = JSON.parse(fs.readFileSync(`node_modules/${name}/package.json`, 'utf8'));
            if (pkg.version !== version) {
              throw new Error(`${name} version mismatch: expected ${version}, got ${pkg.version}`);
            }
          }
          EOF

      - name: Validate public env schema
        run: npm run env:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build
        env:
          VITE_APP_ENV: ci
          VITE_APP_NAME: Bougnat Darts
          VITE_APP_VERSION: ${{ github.sha }}
          VITE_APP_URL: http://localhost:3000
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          VITE_ENABLE_ANALYTICS: false
          VITE_ENABLE_BETA_BADGE: false
          VITE_LOG_LEVEL: warn
