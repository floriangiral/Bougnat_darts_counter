name: Quality Gate

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    branches:
      - main
      - preprod
      - develop
      - "release/**"
  push:
    branches:
      - main
  schedule:
    - cron: "47 6 * * 1"
  workflow_dispatch:

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Typecheck, Unit Tests, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup CI app
        uses: ./.github/actions/setup-ci-app
        with:
          required-packages: "eslint vite vitest"

      - name: Validate public env schema
        run: npm run env:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build
        env:
          VITE_APP_ENV: ci
          VITE_APP_NAME: Bougnat Darts
          VITE_APP_VERSION: ${{ github.sha }}
          VITE_APP_URL: http://localhost:3000
          VITE_CF_WEB_ANALYTICS_TOKEN: ci-placeholder-token
          VITE_ENABLE_VOICE_SCORING: false
          VITE_APP_ACCESS_MODE: local
          VITE_LOG_LEVEL: warn

      - name: Verify generated app QR asset
        run: test -s public/app-qr.svg

      - name: Quality summary
        run: |
          {
            echo "## Quality Gate"
            echo ""
            echo "- Ref: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Result: lint, typecheck, unit tests and build passed"
          } >> "$GITHUB_STEP_SUMMARY"

  global-quality-baseline:
    name: Global Quality Baseline
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup CI app
        uses: ./.github/actions/setup-ci-app
        with:
          required-packages: "vitest @vitest/coverage-v8"

      - name: Enforce global coverage floors
        run: npm run test:unit:coverage

      - name: Publish global quality baseline
        shell: bash
        run: |
          set -euo pipefail
          node <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('node:fs');
          const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
          const total = summary.total;
          console.log('## Global Quality Baseline');
          console.log('');
          console.log('- Scope: full application on PRs targeting `main`');
          console.log(`- Statements: **${total.statements.pct}%**`);
          console.log(`- Branches: **${total.branches.pct}%**`);
          console.log(`- Functions: **${total.functions.pct}%**`);
          console.log(`- Lines: **${total.lines.pct}%**`);
          console.log('- Floors: `75%` statements/lines, `60%` branches, `75%` functions');
          EOF

  sonar:
    name: SonarCloud
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup CI app
        uses: ./.github/actions/setup-ci-app
        with:
          required-packages: "vitest @vitest/coverage-v8"

      - name: Generate coverage report
        run: npm run test:unit:coverage

      - name: Run SonarCloud analysis
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
