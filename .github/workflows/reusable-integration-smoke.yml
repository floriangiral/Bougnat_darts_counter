name: Reusable Integration Smoke

on:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  E2E_AUTH_ENABLED: false

permissions:
  contents: read

jobs:
  integration-smoke:
    name: Local Integration Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Setup CI app
        uses: ./.github/actions/setup-ci-app
        with:
          required-packages: "vite @playwright/test supabase wait-on"
          install-playwright: "true"

      - name: Start Supabase
        run: npm run supabase:start

      - name: Reset and seed local database
        run: npm run supabase:reset:seeded

      - name: Export local Supabase env
        run: |
          STATUS_ENV="$(npx supabase status -o env)"
          echo "$STATUS_ENV" >> "$GITHUB_ENV"
          eval "$STATUS_ENV"
          {
            echo "PLAYWRIGHT_BASE_URL=http://127.0.0.1:4173"
            echo "VITE_APP_ENV=ci"
            echo "VITE_APP_NAME=Bougnat Darts"
            echo "VITE_APP_VERSION=${GITHUB_SHA}"
            echo "VITE_APP_URL=http://127.0.0.1:4173"
            echo "VITE_SUPABASE_URL=http://127.0.0.1:54321"
            echo "VITE_SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "VITE_ENABLE_ANALYTICS=false"
            echo "VITE_ENABLE_BETA_BADGE=false"
            echo "VITE_LOG_LEVEL=warn"
          } >> "$GITHUB_ENV"

      - name: Build app
        run: npm run build

      - name: Verify generated app QR asset
        run: test -s public/app-qr.svg

      - name: Start preview server
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/bougnat-preview.log 2>&1 &
          npx wait-on http://127.0.0.1:4173

      - name: Run Playwright smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results

      - name: Stop Supabase
        if: always()
        run: npm run supabase:stop
