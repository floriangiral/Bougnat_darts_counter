name: Reusable Integration Smoke

on:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  integration-smoke:
    name: Local Integration Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup CI app
        uses: ./.github/actions/setup-ci-app
        with:
          required-packages: "vite @playwright/test wait-on"
          install-playwright: "true"

      - name: Export local smoke env
        run: |
          {
            echo "PLAYWRIGHT_BASE_URL=http://127.0.0.1:4173"
            echo "VITE_APP_ENV=ci"
            echo "VITE_APP_NAME=Bougnat Darts"
            echo "VITE_APP_VERSION=${GITHUB_SHA}"
            echo "VITE_APP_URL=http://127.0.0.1:4173"
            echo "VITE_ENABLE_ANALYTICS=false"
            echo "VITE_ENABLE_BETA_BADGE=false"
            echo "VITE_ENABLE_VOICE_SCORING=false"
            echo "VITE_APP_ACCESS_MODE=local"
            echo "VITE_LOG_LEVEL=warn"
          } >> "$GITHUB_ENV"

      - name: Build app
        run: npm run build

      - name: Verify generated app QR asset
        run: test -s public/app-qr.svg

      - name: Start preview server
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/bougnat-preview.log 2>&1 &
          npx wait-on http://127.0.0.1:4173

      - name: Run Playwright smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
