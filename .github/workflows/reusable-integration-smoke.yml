name: Reusable Integration Smoke

on:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  integration-smoke:
    name: Local Integration Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup CI app
        uses: ./.github/actions/setup-ci-app
        with:
          required-packages: "vite @playwright/test wait-on wrangler"
          install-playwright: "true"

      - name: Run local smoke validation
        uses: ./.github/actions/run-local-smoke
        with:
          app-version: ${{ github.sha }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results

      - name: Smoke summary
        run: |
          {
            echo "## Smoke Validation"
            echo ""
            echo "- Ref: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Result: local preview smoke tests passed"
          } >> "$GITHUB_STEP_SUMMARY"
