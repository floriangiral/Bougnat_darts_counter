name: OpenSSF Scorecard Summary

# Spec 119 (V2-SEC-04) FR-03 : résumé publié après chaque analyse Scorecard réussie, séparé du
# workflow d'analyse pour respecter ses restrictions de publication.

on:
  workflow_run:
    workflows:
      - OpenSSF Scorecard
    types:
      - completed

permissions: {}

jobs:
  summary:
    name: Scorecard summary
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Retrieve previous scores
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/previous"
          previous_run="$(gh run list --workflow scorecard-summary.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [[ -n "$previous_run" ]]; then
            gh run download "$previous_run" --name scorecard-scores --dir "$RUNNER_TEMP/previous" || echo "Scores précédents indisponibles."
          fi

      - name: Fetch published scores
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p scorecard-scores
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --max-time 20 "https://api.scorecard.dev/projects/github.com/${REPOSITORY}" -o scorecard-scores/scorecard.json; then
              exit 0
            fi
            sleep 30
          done
          echo "::error::Scores Scorecard publiés introuvables." >&2
          exit 1

      - name: Write summary
        run: node scripts/ci-scorecard-summary.mjs scorecard-scores/scorecard.json "$RUNNER_TEMP/previous/scorecard.json"

      - name: Keep scores for the next comparison
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-scores
          path: scorecard-scores/scorecard.json
          retention-days: 90
