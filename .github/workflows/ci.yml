name: CI

on:
  pull_request:
    branches:
      - main
      - preprod
      - develop
      - "release/**"
  push:
    branches:
      - main
      - preprod
      - develop
      - "release/**"

jobs:
  checks:
    name: Lint, Typecheck, Build
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'preprod' && 'preprod' || github.ref_name == 'main' && 'production' || 'ci' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate required public env names
        run: npm run env:check

      - name: Validate preprod environment wiring
        if: github.ref_name == 'preprod'
        run: npm run preprod:check
        env:
          VITE_APP_ENV: ${{ vars.VITE_APP_ENV }}
          VITE_APP_NAME: ${{ vars.VITE_APP_NAME }}
          VITE_APP_URL: ${{ vars.VITE_APP_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_ENABLE_BETA_BADGE: ${{ vars.VITE_ENABLE_BETA_BADGE }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          VITE_APP_ENV: ${{ github.ref_name == 'preprod' && vars.VITE_APP_ENV || 'ci' }}
          VITE_APP_NAME: ${{ github.ref_name == 'preprod' && vars.VITE_APP_NAME || 'Bougnat Darts' }}
          VITE_APP_URL: ${{ github.ref_name == 'preprod' && vars.VITE_APP_URL || 'http://localhost:3000' }}
          VITE_SUPABASE_URL: ${{ github.ref_name == 'preprod' && vars.VITE_SUPABASE_URL || 'http://127.0.0.1:54321' }}
          VITE_SUPABASE_ANON_KEY: ${{ github.ref_name == 'preprod' && secrets.VITE_SUPABASE_ANON_KEY || 'ci-placeholder-anon-key' }}
          VITE_ENABLE_ANALYTICS: ${{ github.ref_name == 'preprod' && vars.VITE_ENABLE_ANALYTICS || 'false' }}
          VITE_ENABLE_BETA_BADGE: ${{ github.ref_name == 'preprod' && vars.VITE_ENABLE_BETA_BADGE || 'false' }}
          VITE_LOG_LEVEL: ${{ github.ref_name == 'preprod' && vars.VITE_LOG_LEVEL || 'warn' }}

# Deployment is intentionally excluded from GitHub Actions.
# Vercel should deploy automatically from GitHub integration:
# - preprod branch -> stable deployment of the preprod Vercel project
# - main branch -> stable deployment of the production Vercel project
