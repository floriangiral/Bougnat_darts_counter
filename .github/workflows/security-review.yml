name: Security Review

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    branches:
      - main
      - develop
      - preprod
      - "release/**"
  push:
    branches:
      - main
      - develop
      - preprod
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  npm-audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup CI app
        uses: ./.github/actions/setup-ci-app
        with:
          required-packages: "eslint vite vitest wrangler"

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit full dependency tree
        run: npm audit --audit-level=critical

      - name: Audit summary
        if: success()
        run: |
          {
            echo "## Security Review"
            echo ""
            echo "- Ref: \`${GITHUB_REF_NAME}\`"
            echo "- Result: npm audit thresholds passed"
          } >> "$GITHUB_STEP_SUMMARY"

  snyk:
    name: Snyk Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Forks and Dependabot runs never receive repository secrets: skip with a
      # notice there, but fail loudly anywhere else so a missing token is noticed.
      - name: Check Snyk token availability
        id: token
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          IS_DEPENDABOT: ${{ github.actor == 'dependabot[bot]' }}
        run: |
          if [ -n "${SNYK_TOKEN}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [ "${IS_FORK_PR}" = "true" ] || [ "${IS_DEPENDABOT}" = "true" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Snyk skipped::SNYK_TOKEN is not exposed to fork or Dependabot runs; NPM Audit and Dependency Review still apply."
          else
            echo "::error title=Snyk token missing::Repository secret SNYK_TOKEN is not configured. See SECURITY.md (secret rotation)."
            exit 1
          fi

      - name: Run Snyk dependency analysis
        id: snyk
        if: steps.token.outputs.available == 'true'
        continue-on-error: true
        uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: >-
            --file=package-lock.json
            --severity-threshold=high
            --sarif-file-output=snyk.sarif

      - name: Upload Snyk results to code scanning
        if: always() && steps.token.outputs.available == 'true' && hashFiles('snyk.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: snyk.sarif
          category: snyk-dependencies

      - name: Record dependency snapshot in Snyk
        if: steps.token.outputs.available == 'true' && steps.snyk.outcome == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: monitor
          args: >-
            --file=package-lock.json
            --project-name=floriangiral/Bougnat_darts_counter
            --target-reference=main

      - name: Snyk summary
        if: always() && steps.token.outputs.available == 'true'
        env:
          SNYK_OUTCOME: ${{ steps.snyk.outcome }}
        run: |
          {
            echo "## Snyk Dependencies"
            echo ""
            echo "- Scope: npm production and development dependencies (\`package-lock.json\`)"
            echo "- Severity threshold: high"
            if [ "${SNYK_OUTCOME}" = "success" ]; then
              echo "- Result: no high or critical vulnerabilities detected"
            else
              echo "- Result: failed (high/critical vulnerabilities, or Snyk error such as an expired token: SNYK-0005)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on Snyk findings or errors
        if: steps.snyk.outcome == 'failure'
        run: |
          echo "::error title=Snyk Dependencies failed::High/critical vulnerabilities were found or Snyk could not run (for SNYK-0005, renew SNYK_TOKEN, see SECURITY.md). See the step log and the Security tab."
          exit 1

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: ${{ github.event_name == 'schedule' && 'security-extended' || 'security-and-quality' }}

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
