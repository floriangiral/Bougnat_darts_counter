name: Security Review

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    branches:
      - main
      - develop
      - preprod
      - "release/**"
  push:
    branches:
      - main
      - develop
      - preprod
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  npm-audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup CI app
        uses: ./.github/actions/setup-ci-app
        with:
          required-packages: "eslint vite vitest wrangler"

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit full dependency tree
        run: npm audit --audit-level=critical

      - name: Audit summary
        if: success()
        run: |
          {
            echo "## Security Review"
            echo ""
            echo "- Ref: \`${GITHUB_REF_NAME}\`"
            echo "- Result: npm audit thresholds passed"
          } >> "$GITHUB_STEP_SUMMARY"

  snyk:
    name: Snyk Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup CI app
        uses: ./.github/actions/setup-ci-app
        with:
          required-packages: "vitest"

      - name: Run Snyk dependency analysis
        uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=package.json --package-manager=npm

      - name: Snyk summary
        if: success()
        run: |
          {
            echo "## Snyk"
            echo ""
            echo "- Scope: npm production and development dependencies"
            echo "- Severity threshold: high"
            echo "- Result: no high or critical vulnerabilities detected"
          } >> "$GITHUB_STEP_SUMMARY"

  snyk-container:
    name: Snyk Container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build --pull -t bougnat-darts-ci:${{ github.sha }} -f docker/app.Dockerfile .

      - name: Scan Docker image with Snyk
        uses: snyk/actions/docker@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: bougnat-darts-ci:${{ github.sha }}
          args: --severity-threshold=high

      - name: Snyk container summary
        if: success()
        run: |
          {
            echo "## Snyk Container"
            echo ""
            echo "- Image: \`bougnat-darts-ci:${GITHUB_SHA}\`"
            echo "- Dockerfile: \`docker/app.Dockerfile\`"
            echo "- Severity threshold: high"
            echo "- Result: no high or critical vulnerabilities detected"
          } >> "$GITHUB_STEP_SUMMARY"

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: ${{ github.event_name == 'schedule' && 'security-extended' || 'security-and-quality' }}

      - name: Analyze
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
