name: Security Review

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    branches:
      - main
      - "release/**"
  push:
    branches:
      - main
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: security-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  npm-audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        env:
          NODE_ENV: development
        run: |
          install_ok=1
          npm ci --include=dev --no-audit --no-fund || install_ok=0
          node <<'EOF' || install_ok=0
          const fs = require('fs');
          const checks = ['npm', 'eslint', 'vite', 'vitest'];
          const missing = checks.filter((name) => {
            if (name === 'npm') return false;
            return !fs.existsSync(`node_modules/${name}/package.json`);
          });
          if (missing.length > 0) {
            console.log(`Missing after npm ci: ${missing.join(', ')}`);
            process.exit(1);
          }
          EOF
          if [ "$install_ok" -ne 1 ]; then
            rm -rf node_modules
            corepack enable
            corepack prepare pnpm@10.18.3 --activate
            pnpm install --no-frozen-lockfile --config.node-linker=hoisted
          fi

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit full dependency tree
        run: npm audit --audit-level=critical

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Analyze
        uses: github/codeql-action/analyze@v4
