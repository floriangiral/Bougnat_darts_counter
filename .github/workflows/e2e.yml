name: End-to-End

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  E2E_AUTH_ENABLED: false

on:
  pull_request:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Playwright Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        env:
          NODE_ENV: development
        run: |
          install_ok=1
          npm ci --include=dev --no-audit --no-fund || install_ok=0
          node <<'EOF' || install_ok=0
          const fs = require('fs');
          const checks = ['vite', '@playwright/test', 'supabase'];
          const missing = checks.filter((name) => !fs.existsSync(`node_modules/${name}/package.json`));
          if (missing.length > 0) {
            console.log(`Missing after npm ci: ${missing.join(', ')}`);
            process.exit(1);
          }
          EOF
          if [ "$install_ok" -ne 1 ]; then
            rm -rf node_modules
            corepack enable
            corepack prepare pnpm@10.18.3 --activate
            pnpm install --no-frozen-lockfile --config.node-linker=hoisted
          fi
          node <<'EOF'
          const fs = require('fs');
          const checks = ['vite', '@playwright/test', 'supabase'];
          const missing = checks.filter((name) => !fs.existsSync(`node_modules/${name}/package.json`));
          if (missing.length > 0) {
            throw new Error(`Missing after fallback install: ${missing.join(', ')}`);
          }
          EOF

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start Supabase
        run: npm run supabase:start

      - name: Reset and seed local database
        run: npm run supabase:reset:seeded

      - name: Export local Supabase env
        run: |
          STATUS_ENV="$(npx supabase status -o env)"
          echo "$STATUS_ENV" >> "$GITHUB_ENV"
          eval "$STATUS_ENV"
          {
            echo "VITE_APP_ENV=ci"
            echo "VITE_APP_NAME=Bougnat Darts"
            echo "VITE_APP_VERSION=${GITHUB_SHA}"
            echo "VITE_APP_URL=http://127.0.0.1:4173"
            echo "VITE_SUPABASE_URL=http://127.0.0.1:54321"
            echo "VITE_SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "VITE_ENABLE_ANALYTICS=false"
            echo "VITE_ENABLE_BETA_BADGE=false"
            echo "VITE_LOG_LEVEL=warn"
          } >> "$GITHUB_ENV"

      - name: Build app
        run: npm run build

      - name: Start preview server
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/bougnat-preview.log 2>&1 &
          npx wait-on http://127.0.0.1:4173

      - name: Run Playwright smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results

      - name: Stop Supabase
        if: always()
        run: npm run supabase:stop
