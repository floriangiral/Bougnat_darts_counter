name: Dependency Watch

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: "43 6 * * 1"
  workflow_dispatch:

concurrency:
  group: dependency-watch
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  outdated-report:
    name: Outdated Dependencies Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        env:
          NODE_ENV: development
        run: |
          install_ok=1
          npm ci --include=dev --no-audit --no-fund || install_ok=0
          node <<'EOF' || install_ok=0
          const fs = require('fs');
          const checks = ['vite', 'vitest', 'eslint'];
          const missing = checks.filter((name) => !fs.existsSync(`node_modules/${name}/package.json`));
          if (missing.length > 0) {
            console.log(`Missing after npm ci: ${missing.join(', ')}`);
            process.exit(1);
          }
          EOF
          if [ "$install_ok" -ne 1 ]; then
            rm -rf node_modules
            corepack enable
            corepack prepare pnpm@10.18.3 --activate
            pnpm install --no-frozen-lockfile --config.node-linker=hoisted
          fi
          node <<'EOF'
          const fs = require('fs');
          const checks = ['vite', 'vitest', 'eslint'];
          const missing = checks.filter((name) => !fs.existsSync(`node_modules/${name}/package.json`));
          if (missing.length > 0) {
            throw new Error(`Missing after fallback install: ${missing.join(', ')}`);
          }
          EOF

      - name: Generate outdated report
        run: |
          npm outdated --json > outdated.json || true
          node <<'EOF'
          const fs = require('fs');
          const path = 'outdated.json';
          const hasReport = fs.existsSync(path) && fs.statSync(path).size > 0;
          const report = hasReport ? JSON.parse(fs.readFileSync(path, 'utf8')) : {};
          const entries = Object.entries(report);
          const summary = [];
          summary.push('## Dependency Watch');
          summary.push('');
          if (entries.length === 0) {
            summary.push('No outdated packages detected.');
          } else {
            summary.push('| Package | Current | Wanted | Latest |');
            summary.push('| --- | --- | --- | --- |');
            for (const [name, info] of entries) {
              summary.push(`| ${name} | ${info.current} | ${info.wanted} | ${info.latest} |`);
            }
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary.join('\n')}\n`);
          EOF
