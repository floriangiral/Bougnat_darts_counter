services:
  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    working_dir: /workspace
    command: sh -c "node scripts/generate-app-qr.mjs && node node_modules/vite/bin/vite.js --host 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace
      - /workspace/node_modules
    env_file:
      - .env.local
    stdin_open: true
    tty: true

  playwright:
    build:
      context: .
      dockerfile: docker/playwright.Dockerfile
    working_dir: /workspace
    depends_on:
      - app
    environment:
      PLAYWRIGHT_BASE_URL: http://app:3000
    profiles:
      - e2e
    volumes:
      - .:/workspace
      - ./node_modules:/workspace/node_modules
      - ./test-results:/workspace/test-results

# Notes:
# - This compose file is only for the Vite app when you want containerized local dev.
# - The playwright service uses the official Playwright image, including Chromium.
#   Run it with: docker compose --profile e2e run --rm playwright
# - No backend stack is required for the supported offline-first runtime.
