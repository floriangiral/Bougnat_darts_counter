sonar.projectKey=floriangiral_Bougnat_darts_counter
sonar.organization=floriangiral
sonar.host.url=https://sonarcloud.io
sonar.sources=App.tsx,components,functions,lib,src,utils,views
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts,tests/**/*.test.tsx
sonar.exclusions=dist/**,coverage/**,test-results/**,node_modules/**,public/*.png,public/*.svg
# UI composition is validated through Playwright; keep business and presentation models covered by Vitest.
sonar.coverage.exclusions=App.tsx,components/**,views/**,src/features/smartphone/**,src/features/tablet/useTabletLayout.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json
sonar.qualitygate.wait=true
